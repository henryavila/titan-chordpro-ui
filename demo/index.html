<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Demos · titan-chordpro-ui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="./boot-shell.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html {
        margin: 0;
        min-height: 100%;
        background: #0B0D12;
        overflow-x: clip;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body, #app {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
        background: #0B0D12;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="cpv-boot" data-boot-theme="standalone" data-boot-shell role="status" aria-busy="true" aria-live="polite">
        <div class="cpv-boot-head">
          <span class="cpv-boot-kicker">titan-chordpro-ui</span>
          <span class="cpv-boot-title">Demos</span>
        </div>
        <div class="cpv-boot-page">
          <div class="cpv-boot-spin" aria-hidden="true"></div>
          <p class="cpv-boot-msg">Preparando…</p>
        </div>
      </div>
    </div>
    <script type="module" src="./hub.ts"></script>
  </body>
</html>
