<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<style>
:root{
  --canvas:#0B0D12; --veil:rgba(20,23,31,0.72); --veil-2:rgba(14,17,23,0.86);
  --line:rgba(255,255,255,0.10); --line-soft:rgba(255,255,255,0.06);
  --text:#EAECF2; --muted:#888F9E;
  --chord:#84DFA6; --chord-ink:#10131A; --chord-soft:rgba(132,223,166,0.10); --chord-edge:rgba(132,223,166,0.30);
  --chord-fill:rgba(132,223,166,0.17);
  --surface:rgba(255,255,255,0.04); --sel:rgba(255,255,255,0.10); --sel-line:rgba(255,255,255,0.22);
  --pill:#E8EAF0; --pill-ink:#13161D; --focus:#9EB8FF;
}
html,body{margin:0;padding:0;height:100%;background:var(--canvas);overflow:hidden;overscroll-behavior:none;}
*,*::before,*::after{box-sizing:border-box;}
a{color:var(--chord);text-decoration:none;} a:hover{opacity:0.75;}
button{font-family:inherit;}
</style>
</helmet>
<div style="position:relative;height:100dvh;min-height:600px;width:100%;overflow:hidden;background:var(--canvas);color:var(--text);font-family:Sora,system-ui,sans-serif;display:flex;flex-direction:column;">

  <header style="flex:none;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--veil);">
    <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
      <span style="font-size:15px;font-weight:600;letter-spacing:-0.015em;white-space:nowrap;">Tua Vontade <span style="color:var(--muted);font-weight:400;">·</span> Solo do interlúdio</span>
      <span style="font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted);">4/4 · 92 BPM</span>
    </div>

    <div style="display:flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface);">
      <sc-for list="{{ insts }}" as="i" hint-placeholder-count="2">
        <button onClick="{{ i.go }}" style="height:30px;padding:0 13px;border:0;border-radius:9px;background:{{ i.bg }};color:{{ i.ink }};font-size:12px;font-weight:{{ i.weight }};cursor:pointer;">{{ i.label }}</button>
      </sc-for>
    </div>

    <div style="flex:1;"></div>

    <div style="display:flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface);">
      <sc-for list="{{ views }}" as="v" hint-placeholder-count="3">
        <button onClick="{{ v.go }}" disabled="{{ v.off }}" style="height:30px;padding:0 13px;border:0;border-radius:9px;background:{{ v.bg }};color:{{ v.ink }};font-size:12px;font-weight:{{ v.weight }};cursor:{{ v.cursor }};opacity:{{ v.op }};">{{ v.label }}</button>
      </sc-for>
    </div>

    <button onClick="{{ togglePlay }}" style="display:flex;align-items:center;gap:8px;height:36px;padding:0 15px;border:1px solid {{ playBorder }};border-radius:11px;background:{{ playBg }};color:{{ playInk }};font-size:12.5px;font-weight:600;cursor:pointer;">
      <span style="width:10px;height:10px;background:currentColor;clip-path:{{ playClip }};"></span>{{ playLabel }}
    </button>

    <button style="height:36px;padding:0 15px;border:0;border-radius:11px;background:var(--pill);color:var(--pill-ink);font-size:12.5px;font-weight:700;cursor:pointer;">Salvar no bloco</button>
  </header>

  <section style="flex:1;min-height:0;overflow:auto;padding:24px 20px;display:flex;justify-content:center;">
    <div style="width:100%;max-width:1080px;padding:16px 6px;border-radius:16px;background:var(--veil);border:1px solid var(--line-soft);overflow-x:auto;">
      <div ref="{{ hostRef }}" style="min-height:170px;"></div>
      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <p style="margin:44px 0;text-align:center;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);">Escolha a figura e toque uma tecla para começar</p>
      </sc-if>
    </div>
  </section>

  <div style="flex:none;display:flex;align-items:center;gap:12px;padding:0 20px 10px;">
    <span style="font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:700;">Compassos</span>
    <div style="display:flex;gap:7px;">
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
        <span style="display:flex;gap:2px;padding:3px;border:1px solid {{ b.border }};border-radius:7px;">
          <sc-for list="{{ b.beats }}" as="t" hint-placeholder-count="4">
            <span style="width:13px;height:9px;border-radius:2px;background:{{ t.bg }};"></span>
          </sc-for>
        </span>
      </sc-for>
    </div>
    <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);">{{ fillStatus }}</span>
    <div style="flex:1;"></div>
    <span style="font-size:11px;color:var(--muted);">←/→ anda · Backspace apaga · ↑/↓ move a altura</span>
  </div>

  <footer style="flex:none;display:flex;gap:16px;padding:14px 20px 20px;border-top:1px solid var(--line);background:var(--veil-2);">

    <div style="flex:none;display:flex;flex-direction:column;gap:7px;">
      <span style="font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:700;">Figura</span>
      <div style="display:flex;gap:5px;">
        <sc-for list="{{ durs }}" as="d" hint-placeholder-count="5">
          <button onClick="{{ d.go }}" title="{{ d.name }}" style="width:44px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid {{ d.border }};border-radius:11px;background:{{ d.bg }};color:{{ d.ink }};cursor:pointer;">
            <span style="font-size:20px;line-height:1;">{{ d.glyph }}</span>
            <span style="font-family:'Space Mono',monospace;font-size:8.5px;color:var(--muted);">{{ d.beats }}</span>
          </button>
        </sc-for>
      </div>
      <div style="display:flex;gap:5px;">
        <button onClick="{{ toggleSlide }}" style="flex:1;height:30px;border:1px solid {{ slideBorder }};border-radius:10px;background:{{ slideBg }};color:{{ slideInk }};font-size:11.5px;font-weight:600;cursor:pointer;">Slide</button>
        <button onClick="{{ addRest }}" style="flex:1;height:30px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;">Pausa</button>
      </div>
    </div>

    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:700;">Altura</span>
        <span style="font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted);">{{ octLabel }}</span>
        <button onClick="{{ octDown }}" aria-label="Uma oitava abaixo" style="width:26px;height:22px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--text);font-size:13px;line-height:1;cursor:pointer;">−</button>
        <button onClick="{{ octUp }}" aria-label="Uma oitava acima" style="width:26px;height:22px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--text);font-size:13px;line-height:1;cursor:pointer;">+</button>
        <span style="flex:1;"></span>
        <span style="font-family:'Space Mono',monospace;font-size:10.5px;color:var(--chord);">{{ tabHint }}</span>
      </div>
      <div style="position:relative;height:96px;overflow-x:auto;">
        <div style="position:relative;height:92px;width:max-content;">
          <div style="display:flex;gap:2px;">
            <sc-for list="{{ whites }}" as="w" hint-placeholder-count="15">
              <button onClick="{{ w.go }}" aria-label="{{ w.aria }}" style="width:38px;height:92px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;border:1px solid {{ w.border }};border-radius:0 0 8px 8px;background:{{ w.bg }};color:{{ w.ink }};font-family:'Space Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;">{{ w.label }}</button>
            </sc-for>
          </div>
          <sc-for list="{{ blacks }}" as="b" hint-placeholder-count="10">
            <button onClick="{{ b.go }}" aria-label="{{ b.aria }}" style="position:absolute;top:0;left:{{ b.left }};width:24px;height:58px;border:1px solid {{ b.border }};border-radius:0 0 6px 6px;background:{{ b.bg }};cursor:pointer;"></button>
          </sc-for>
        </div>
      </div>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:840}}">
const STR_MIDI = [64, 59, 55, 50, 45, 40];
const STR_LBL = ["e", "B", "G", "D", "A", "E"];
const NAMES = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
const PT = { c: "Dó", d: "Ré", e: "Mi", f: "Fá", g: "Sol", a: "Lá", b: "Si" };
const DURS = [
  { d: "w", b: 4, glyph: "\u{1D15D}", name: "Semibreve" },
  { d: "h", b: 2, glyph: "\u{1D15E}", name: "M\u00ednima" },
  { d: "q", b: 1, glyph: "\u2669", name: "Sem\u00ednima" },
  { d: "8", b: 0.5, glyph: "\u266A", name: "Colcheia" },
  { d: "16", b: 0.25, glyph: "\u266C", name: "Semicolcheia" }
];
const BEATS = { w: 4, h: 2, q: 1, "8": 0.5, "16": 0.25 };
const INK = "#EAECF2";

class Component extends DCLogic {
  state = {
    inst: "guitar", view: "both", dur: "q", slide: false, oct: 4, sel: 4, playing: false, playIdx: -1,
    notes: [
      { midi: 62, dur: "8" }, { midi: 64, dur: "8" }, { midi: 67, dur: "q" },
      { midi: 69, dur: "8", slide: true }, { midi: 71, dur: "8" }, { midi: 67, dur: "h" },
      { midi: 62, dur: "q" }, { midi: 64, dur: "q" }
    ]
  };

  hostRef = (el) => { this.host = el; };

  componentDidMount() {
    this.waitVex();
    this.onKey = (e) => {
      if (e.key === "ArrowLeft") { this.move(-1); e.preventDefault(); }
      if (e.key === "ArrowRight") { this.move(1); e.preventDefault(); }
      if (e.key === "ArrowUp") { this.nudge(1); e.preventDefault(); }
      if (e.key === "ArrowDown") { this.nudge(-1); e.preventDefault(); }
      if (e.key === "Backspace") { this.del(); e.preventDefault(); }
      if (e.key === " ") { this.togglePlay(); e.preventDefault(); }
    };
    window.addEventListener("keydown", this.onKey);
  }
  componentWillUnmount() {
    window.removeEventListener("keydown", this.onKey);
    clearTimeout(this.playTimer);
    if (this.ac) this.ac.close();
  }
  componentDidUpdate() { this.draw(); }
  waitVex = () => {
    if (window.Vex && window.Vex.Flow) { this.draw(); return; }
    this.vexTimer = setTimeout(this.waitVex, 90);
  };

  // A altura é a fonte: a casa/corda do violão é derivada dela, nunca digitada.
  toTab(midi) {
    let best = null;
    for (let s = 0; s < 6; s++) {
      const fret = midi - STR_MIDI[s];
      if (fret < 0 || fret > 15) continue;
      if (!best || fret < best.fret) best = { str: s, fret };
    }
    return best;
  }
  filled() { return this.state.notes.reduce((a, n) => a + (BEATS[n.dur] || 1), 0); }
  columns() {
    const out = []; let acc = 0;
    this.state.notes.forEach((n, i) => {
      out.push({ kind: "note", i, n });
      acc += BEATS[n.dur] || 1;
      if (acc >= 4 && Math.abs(acc % 4) < 0.001) out.push({ kind: "bar" });
    });
    return out;
  }

  add = (midi) => () => {
    this.setState(st => ({
      notes: st.notes.concat([{ midi, dur: st.dur, slide: st.slide }]),
      sel: st.notes.length
    }), () => this.beep(midi, 0.3));
  };
  addRest = () => this.setState(st => ({
    notes: st.notes.concat([{ rest: true, dur: st.dur }]), sel: st.notes.length
  }));
  move = (d) => this.setState(st => ({ sel: Math.max(0, Math.min(st.notes.length - 1, st.sel + d)) }));
  nudge = (d) => this.setState(st => ({
    notes: st.notes.map((n, j) => j === st.sel && !n.rest ? { ...n, midi: Math.max(40, Math.min(84, n.midi + d)) } : n)
  }));
  del = () => this.setState(st => {
    const notes = st.notes.filter((_, j) => j !== st.sel);
    return { notes, sel: Math.max(0, Math.min(notes.length - 1, st.sel)) };
  });
  setDur = (d) => () => this.setState(st => ({
    dur: d, notes: st.notes.map((n, j) => j === st.sel ? { ...n, dur: d } : n)
  }));
  toggleSlide = () => this.setState(st => ({ slide: !st.slide }));

  togglePlay = () => {
    if (this.state.playing) { clearTimeout(this.playTimer); this.setState({ playing: false, playIdx: -1 }); return; }
    if (!this.state.notes.length) return;
    this.setState({ playing: true, playIdx: 0 }, () => this.step(0));
  };
  step(i) {
    const n = this.state.notes[i];
    if (!n) { this.setState({ playing: false, playIdx: -1 }); return; }
    const sec = (BEATS[n.dur] || 1) * (60 / 92);
    if (!n.rest) this.beep(n.midi, sec);
    this.setState({ playIdx: i });
    this.playTimer = setTimeout(() => { if (this.state.playing) this.step(i + 1); }, sec * 1000);
  }
  beep(midi, sec) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = this.ac || new AC();
      const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = this.state.inst === "piano" ? "sine" : "triangle";
      o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.12, sec * 0.92));
      o.connect(g).connect(this.ac.destination);
      o.start(t); o.stop(t + sec + 0.05);
    } catch (e) { /* sem áudio */ }
  }

  key(midi) { return NAMES[midi % 12] + "/" + (Math.floor(midi / 12) - 1); }

  draw() {
    const V = window.Vex && window.Vex.Flow;
    if (!V || !this.host) return;
    this.host.innerHTML = "";
    const notes = this.state.notes;
    if (!notes.length) return;
    const piano = this.state.inst === "piano";
    const view = piano ? "score" : this.state.view;
    const both = view === "both";
    const W = Math.max(760, notes.length * 62 + 160);
    const H = piano ? 246 : (both ? 258 : 152);
    const r = new V.Renderer(this.host, V.Renderer.Backends.SVG);
    r.resize(W, H);
    const ctx = r.getContext();
    ctx.setFillStyle(INK); ctx.setStrokeStyle(INK);
    const ink = { fillStyle: INK, strokeStyle: INK };
    const cols = this.columns();
    const total = this.filled() || 4;
    const mk = (arr) => new V.Voice({ num_beats: total, beat_value: 4 }).setStrict(false).addTickables(arr);
    const mkNote = (c, clef) => {
      if (c.n.rest) {
        const rn = new V.StaveNote({ keys: [clef === "bass" ? "d/3" : "b/4"], duration: c.n.dur + "r", clef });
        rn.setStyle(ink); return rn;
      }
      const sn = new V.StaveNote({ keys: [this.key(c.n.midi)], duration: c.n.dur, clef });
      if (NAMES[c.n.midi % 12].indexOf("#") > -1) sn.addModifier(new V.Accidental("#"), 0);
      sn.setStyle(ink); return sn;
    };

    if (piano) {
      const tre = [], bas = [];
      for (const c of cols) {
        if (c.kind === "bar") { tre.push(new V.BarNote()); bas.push(new V.BarNote()); continue; }
        const low = !c.n.rest && c.n.midi < 60;
        tre.push(low ? new V.GhostNote({ duration: c.n.dur }) : mkNote(c, "treble"));
        bas.push(low ? mkNote(c, "bass") : new V.GhostNote({ duration: c.n.dur }));
      }
      const s1 = new V.Stave(24, 4, W - 40);
      s1.addClef("treble").addTimeSignature("4/4").setStyle(ink).setContext(ctx).draw();
      const s2 = new V.Stave(24, 116, W - 40);
      s2.addClef("bass").addTimeSignature("4/4").setStyle(ink).setContext(ctx).draw();
      const brace = new V.StaveConnector(s1, s2).setType(V.StaveConnector.type.BRACE);
      brace.setContext(ctx).draw();
      const lineL = new V.StaveConnector(s1, s2).setType(V.StaveConnector.type.SINGLE_LEFT);
      lineL.setContext(ctx).draw();
      const v1 = mk(tre), v2 = mk(bas);
      new V.Formatter().joinVoices([v1]).joinVoices([v2]).format([v1, v2], W - 140);
      v1.draw(ctx, s1); v2.draw(ctx, s2);
      return;
    }

    const sN = [], tN = [];
    for (const c of cols) {
      if (c.kind === "bar") { sN.push(new V.BarNote()); tN.push(new V.BarNote()); continue; }
      sN.push(mkNote(c, "treble"));
      const pos = c.n.rest ? null : this.toTab(c.n.midi);
      const tn = new V.TabNote({ positions: [pos ? { str: pos.str + 1, fret: pos.fret } : { str: 3, fret: 0 }], duration: c.n.dur });
      tn.setStyle(ink); tN.push(tn);
    }
    let stave = null, tabstave = null, v1 = null, v2 = null;
    if (view !== "tab") {
      stave = new V.Stave(10, both ? 2 : 14, W - 24);
      stave.addClef("treble").addTimeSignature("4/4").setStyle(ink).setContext(ctx).draw();
      v1 = mk(sN);
    }
    if (view !== "score") {
      tabstave = new V.TabStave(10, both ? 130 : 16, W - 24);
      tabstave.addClef("tab").setStyle(ink).setContext(ctx).draw();
      v2 = mk(tN);
    }
    const fm = new V.Formatter(); const vs = [];
    if (v1) { fm.joinVoices([v1]); vs.push(v1); }
    if (v2) { fm.joinVoices([v2]); vs.push(v2); }
    fm.format(vs, W - 120);
    if (v1) v1.draw(ctx, stave);
    if (v2) v2.draw(ctx, tabstave);
  }

  renderVals() {
    const st = this.state;
    const piano = st.inst === "piano";
    const base = st.oct * 12 + 12;
    const whites = [], blacks = [];
    const wPat = [0, 2, 4, 5, 7, 9, 11];
    for (let k = 0; k < 15; k++) {
      const oc = Math.floor(k / 7), i = k % 7;
      const midi = base + oc * 12 + wPat[i];
      const nm = NAMES[midi % 12];
      const on = st.notes.some((n, j) => j === st.sel && n.midi === midi);
      whites.push({
        label: PT[nm], aria: PT[nm] + " " + (Math.floor(midi / 12) - 1), go: this.add(midi),
        border: on ? "var(--chord-edge)" : "var(--line)",
        bg: on ? "var(--chord-soft)" : "rgba(255,255,255,0.06)",
        ink: on ? "var(--chord)" : "var(--muted)"
      });
      if (i !== 2 && i !== 6 && k < 14) {
        const bm = midi + 1;
        const bon = st.notes.some((n, j) => j === st.sel && n.midi === bm);
        blacks.push({
          left: (k * 40 + 27) + "px", aria: PT[NAMES[midi % 12]] + " sustenido", go: this.add(bm),
          border: bon ? "var(--chord-edge)" : "rgba(255,255,255,0.14)",
          bg: bon ? "var(--chord-fill)" : "#171A21"
        });
      }
    }

    const filled = this.filled();
    const nBars = Math.max(1, Math.ceil(filled / 4));
    const bars = Array.from({ length: nBars }, (_, bi) => ({
      border: filled > bi * 4 && filled < (bi + 1) * 4 ? "var(--chord-edge)" : "var(--line)",
      beats: Array.from({ length: 4 }, (_, t) => ({
        bg: filled >= bi * 4 + t + 1 ? "var(--chord)" : (filled > bi * 4 + t ? "var(--chord-fill)" : "var(--surface)")
      }))
    }));
    const cur = st.notes[st.sel];
    const tab = cur && !cur.rest ? this.toTab(cur.midi) : null;

    return {
      hostRef: this.hostRef,
      isEmpty: st.notes.length === 0,
      whites, blacks, bars,
      insts: [["guitar", "Violão"], ["piano", "Piano"]].map(([k, label]) => ({
        label, go: () => this.setState({ inst: k }),
        bg: st.inst === k ? "var(--pill)" : "transparent",
        ink: st.inst === k ? "var(--pill-ink)" : "var(--muted)",
        weight: st.inst === k ? 700 : 500
      })),
      views: [["score", "Partitura"], ["tab", "TAB"], ["both", "Ambos"]].map(([k, label]) => {
        const off = piano && k !== "score";
        const on = piano ? k === "score" : st.view === k;
        return {
          label, off, go: () => { if (!off) this.setState({ view: k }); },
          bg: on ? "var(--pill)" : "transparent",
          ink: on ? "var(--pill-ink)" : "var(--muted)",
          weight: on ? 700 : 500, op: off ? 0.35 : 1, cursor: off ? "not-allowed" : "pointer"
        };
      }),
      durs: DURS.map(d => ({
        glyph: d.glyph, name: d.name, beats: d.b + (d.b === 1 ? " tempo" : " tempos"),
        go: this.setDur(d.d),
        border: st.dur === d.d ? "var(--chord-edge)" : "var(--line)",
        bg: st.dur === d.d ? "var(--chord-soft)" : "transparent",
        ink: st.dur === d.d ? "var(--chord)" : "var(--text)"
      })),
      slideBorder: st.slide ? "var(--chord-edge)" : "var(--line)",
      slideBg: st.slide ? "var(--chord-soft)" : "transparent",
      slideInk: st.slide ? "var(--chord)" : "var(--text)",
      toggleSlide: this.toggleSlide, addRest: this.addRest,
      octLabel: "oitavas " + st.oct + "–" + (st.oct + 2),
      octDown: () => this.setState(s => ({ oct: Math.max(2, s.oct - 1) })),
      octUp: () => this.setState(s => ({ oct: Math.min(6, s.oct + 1) })),
      tabHint: piano ? "pauta dupla, sol e fá" : (tab ? "no violão: corda " + STR_LBL[tab.str] + ", casa " + tab.fret : ""),
      togglePlay: this.togglePlay,
      playLabel: st.playing ? "Parar" : "Tocar",
      playClip: st.playing ? "none" : "polygon(0 0, 100% 50%, 0 100%)",
      playBg: st.playing ? "var(--pill)" : "transparent",
      playInk: st.playing ? "var(--pill-ink)" : "var(--text)",
      playBorder: st.playing ? "var(--pill)" : "var(--line)",
      fillStatus: filled % 4 === 0 ? "compasso fechado" : (filled % 4) + " de 4 tempos"
    };
  }
}

</script>
</body>
