# Cloudflare Workers — static demo + import proxy.
# Workers Builds (Git): install → wrangler deploy / wrangler preview.
# Local: `pnpm pages:dev`

name = "titan-chordpro-ui"
main = "functions/worker.ts"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = true
previews = {}

[build]
command = "pnpm run build:pages"

[assets]
directory = "./dist-demo"
run_worker_first = ["/__cifra_fetch", "/__youtube_duration"]
